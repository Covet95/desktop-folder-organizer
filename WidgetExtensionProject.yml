name: DesktopFolderWidgetExtension
options:
  deploymentTarget:
    macOS: "27.2"
  createIntermediateGroups: true
targets:
  DesktopFolderSummaryWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Shared
      - path: WidgetExtension
        excludes:
          - Info.plist
          - WidgetExtension.entitlements
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.covet.DesktopFolderWidget.SummaryExtension
        PRODUCT_NAME: DesktopFolderSummaryWidgetExtension
        SWIFT_VERSION: "5.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        MACOSX_DEPLOYMENT_TARGET: "27.2"
        SUPPORTED_PLATFORMS: macosx
        SDKROOT: macosx
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WidgetExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: WidgetExtension/WidgetExtension.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        SKIP_INSTALL: NO
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
